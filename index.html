<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนที่แปลงกาแฟ</title>
<meta name="description" content="แผนที่ 2D/3D แสดงพาโนรามา ภาพถ่าย ภาพถ่ายทางอากาศ วีดีโอ และข้อมูลของแปลงกาแฟ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="vendor/pannellum.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="map" aria-label="แผนที่แปลงกาแฟ"></div>

<div class="topbar">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <circle cx="17" cy="17" r="17" fill="#2a1a10"/>
      <ellipse cx="17" cy="17" rx="7" ry="10" transform="rotate(30 17 17)" fill="#ffcf5c"/>
      <path d="M13.5 9.5c4 3.2 3 11.6 7 15" fill="none" stroke="#2a1a10" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <div>
      <h1 id="siteTitle">แผนที่แปลงกาแฟ</h1>
      <p id="siteSub"></p>
      <span id="demoFlag" class="demo-flag" hidden>โหมดสาธิต · ข้อมูลตัวอย่าง</span>
    </div>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="ค้นหาแปลง เจ้าของ หรือหมู่บ้าน" autocomplete="off" aria-label="ค้นหาแปลง">
    <button class="btn-list" id="btnList" type="button">แปลงทั้งหมด</button>
    <div class="results" id="results" hidden></div>
  </div>
</div>

<div class="ctrls">
  <div class="seg" role="group" aria-label="มิติแผนที่">
    <button id="b2d" type="button" aria-pressed="true">2D</button>
    <button id="b3d" type="button" aria-pressed="false">3D</button>
  </div>
  <div class="seg" role="group" aria-label="แผนที่ฐาน">
    <button id="bMap" type="button" aria-pressed="true">แผนที่</button>
    <button id="bSat" type="button" aria-pressed="false">ดาวเทียม</button>
  </div>
  <button class="btn-pill" id="btnLogin" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <span>แก้ไขข้อมูล</span>
  </button>
</div>

<div class="legend" id="legend" role="group" aria-label="แสดงหรือซ่อนชนิดข้อมูล"></div>

<aside class="panel" id="panel" hidden aria-live="polite">
  <div class="panel-head">
    <button class="icon-btn" id="pBack" type="button" aria-label="ย้อนกลับ" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="crumb" id="pCrumb"></div>
    <button class="icon-btn" id="pLink" type="button" aria-label="คัดลอกลิงก์" title="คัดลอกลิงก์หน้านี้">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
    </button>
    <button class="icon-btn" id="pClose" type="button" aria-label="ปิด">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="panel-body" id="pBody"></div>
</aside>

<div class="editbar" id="editbar" hidden>
  <button type="button" id="eNewPlot">+ แปลงใหม่</button>
  <button type="button" id="eNewMedia">+ หมุด / สื่อ</button>
  <button type="button" id="eImport">นำเข้าแปลงจากไฟล์</button>
  <button type="button" id="eExport">ส่งออก GeoJSON</button>
  <span class="who" id="eWho"></span>
  <button type="button" id="eLogout">ออกจากระบบ</button>
</div>

<div class="modebar" id="modebar" hidden>
  <span id="modeText"></span>
  <button class="btn sm" type="button" id="mUndo">ย้อนจุด</button>
  <button class="btn sm primary" type="button" id="mDone">เสร็จ</button>
  <button class="btn sm" type="button" id="mCancel">ยกเลิก</button>
</div>

<dialog id="dlg"><form class="dlg" id="dlgForm" method="dialog" novalidate></form></dialog>

<div class="lightbox" id="lightbox" hidden>
  <img id="lbImg" alt="">
  <button class="icon-btn" id="lbClose" type="button" aria-label="ปิดภาพ">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="importFile" accept=".kml,.geojson,.json,.zip" hidden>

<script src="js/config.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pannellum.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/mapstyle.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
